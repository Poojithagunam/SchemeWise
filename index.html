<!DOCTYPE html>
<html>
<head>
    <title>SchemeWise</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>SchemeWise</h1>

    <p>Find government schemes that may be suitable for you.</p>

    <label>Age:</label>
    <input type="number" id="age">

    <br><br>

    <label>Occupation:</label>
    <input type="text" id="occupation">

    <br><br>

    <label>Monthly Income:</label>
    <input type="number" id="income">

    <br><br>

    <label>State:</label>
    <input type="text" id="state">

    <br><br>

    <button id="findButton">Find Schemes</button>
    <div id="results"></div>

    <script src="script.js"></script>

</body>
</html>
